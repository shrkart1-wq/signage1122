<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плеер</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #status {
    position: fixed; left: 12px; bottom: 12px; padding: 8px 14px;
    background: rgba(0,0,0,.7); color: #9f9; font: 14px/1.5 monospace;
    border-radius: 8px; white-space: pre; transition: opacity .5s; z-index: 10;
  }
  #status.error { color: #f99; }
  #status.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<video id="video" muted autoplay playsinline></video>
<div id="status">запуск…</div>
<script>
// ============================================================
// НАСТРОЙКА: вставьте сюда URL веб-приложения Apps Script
// (Расширения → Apps Script → Развернуть → Веб-приложение)
const MANIFEST_URL = 'https://script.google.com/macros/s/AKfycbxyuhY22167cXey26qTRNZOPiddIuTNR-4jpUeq_Ho4n6l5PEPGmJaAymlizSgjYHcA/exec';
// ============================================================

const q = new URLSearchParams(location.search);
const manifestUrl = q.get('manifest') || MANIFEST_URL;
const deviceId = q.get('device') || localStorage.getItem('deviceId') || 'test';
localStorage.setItem('deviceId', deviceId);

let pollMs = 86400000;              // опрос при успехе (сервер переопределяет): по умолчанию раз в сутки
const RETRY_MS = 60000;            // нет связи — пробуем снова каждую минуту, пока не вернётся
let pollTimer = null;
let playlist = [];                 // список ссылок на ролики
let idx = 0;                       // какой ролик сейчас играет
try { playlist = JSON.parse(localStorage.getItem('playlist') || '[]'); } catch (e) {}

const video = document.getElementById('video');
const statusEl = document.getElementById('status');
let statusTimer = null;

function showStatus(text, isError) {
  statusEl.textContent = `[${deviceId}] ${text}`;
  statusEl.classList.toggle('error', !!isError);
  statusEl.classList.remove('hidden');
  clearTimeout(statusTimer);
  // ошибки висят постоянно, обычные сообщения прячутся через 10 сек
  if (!isError) statusTimer = setTimeout(() => statusEl.classList.add('hidden'), 10000);
}

const cacheAvailable = 'caches' in window;

// скачиваем все ролики плейлиста в кэш и удаляем лишние (снятые с показа)
async function syncCache(urls) {
  if (!cacheAvailable) return;
  const cache = await caches.open('video-v1');
  const wanted = new Set(urls.map((u) => new Request(u).url));
  for (const key of await cache.keys()) {
    if (!wanted.has(key.url)) await cache.delete(key);
  }
  for (const url of urls) {
    if (await cache.match(url)) continue;
    try {
      const resp = await fetch(url, { mode: 'cors' });
      if (resp.ok) await cache.put(url, resp);
      else console.warn('не докачал', url, resp.status);
    } catch (e) {
      console.warn('видео не закэшировано:', url, e.message);
    }
  }
}

let objectUrl = null;
let playStartedAt = 0;             // когда начали грузить текущий ролик (для сторожа)
async function playAt(i) {
  if (!playlist.length) return;
  idx = ((i % playlist.length) + playlist.length) % playlist.length;
  const url = playlist[idx];
  // один ролик в списке — зацикливаем его средствами <video>, без стыков;
  // несколько — переключаем вручную по событию "ended"
  video.loop = playlist.length === 1;
  playStartedAt = Date.now();

  if (cacheAvailable) {
    const cache = await caches.open('video-v1');
    const resp = await cache.match(url);
    if (resp) {
      const blob = await resp.blob();
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(blob);
      video.src = objectUrl;
      video.play().catch(() => {});
      return;
    }
  }
  video.src = url; // ещё не закэшировано — играем напрямую
  video.play().catch(() => {});
}

// перейти к следующему ролику, а если он один — перезапустить его
function skipToNext() {
  if (playlist.length > 1) playAt(idx + 1);
  else if (playlist.length === 1) playAt(idx);
}

// доиграл ролик — переходим к следующему по кругу
video.addEventListener('ended', () => { if (playlist.length > 1) playAt(idx + 1); });

// ролик не открылся (битый файл, обрыв, неподдерживаемый кодек) — пропускаем
video.addEventListener('error', () => {
  showStatus('ролик не открылся, пропускаю', true);
  setTimeout(skipToNext, 800);
});

async function applyPlaylist(urls) {
  const changed = JSON.stringify(urls) !== JSON.stringify(playlist);
  if (!changed) return;
  playlist = urls;
  localStorage.setItem('playlist', JSON.stringify(urls));
  await syncCache(urls);         // сначала докачиваем, потом показываем
  idx = 0;
  await playAt(0);
  showStatus('плейлист обновлён: ' + urls.length + ' ролик(ов)');
}

function scheduleNextPoll(delay) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, delay);
}
function pollNow() { scheduleNextPoll(0); }

async function poll() {
  if (!manifestUrl) {
    showStatus('MANIFEST_URL не задан — впишите URL Apps Script в index.html', true);
    return;
  }
  try {
    const u = manifestUrl + (manifestUrl.includes('?') ? '&' : '?') +
      'action=manifest&device=' + encodeURIComponent(deviceId) +
      '&playing=' + encodeURIComponent(playlist[idx] || '') +
      '&t=' + Date.now();
    const resp = await fetch(u, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const m = await resp.json();
    if (m.poll) pollMs = m.poll * 1000;
    // сервер может вернуть список videos[] или одиночный video — принимаем оба
    const urls = (m.videos && m.videos.length) ? m.videos : (m.video ? [m.video] : []);
    if (urls.length) await applyPlaylist(urls);
    else if (!playlist.length) showStatus('для устройства не назначен ролик', true);
    if (playlist.length && !video.src) await playAt(idx);
    scheduleNextPoll(pollMs);         // всё ок — следующий опрос по расписанию (по умолчанию через сутки)
  } catch (e) {
    // офлайн или сервер недоступен — продолжаем крутить закэшированное,
    // но проверяем чаще, чтобы быстро подхватить список, когда сеть вернётся
    if (playlist.length && !video.src) await playAt(idx);
    if (!playlist.length) showStatus('нет связи и нет закэшированных роликов: ' + e.message, true);
    scheduleNextPoll(RETRY_MS);
  }
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// просим браузер не вытеснять кэш с роликами — чтобы офлайн переживался наверняка
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// сеть вернулась после обрыва — сразу проверяем список, не дожидаясь суточного опроса
window.addEventListener('online', pollNow);

showStatus('устройство: ' + deviceId);
if (playlist.length) playAt(0); // после перезагрузки сразу играем из кэша
poll();

// сторож зависаний: раз в 5 сек проверяем, идёт ли показ, и если нет —
// переключаемся на следующий ролик, чтобы битый/медленный не морозил экран
let lastTime = -1, stuckTicks = 0;
setInterval(() => {
  if (!playlist.length) return;

  // ролик так и не начал играть (чёрный экран): не готов дольше 20 сек
  if (video.readyState < 3 && Date.now() - playStartedAt > 20000) {
    stuckTicks = 0; lastTime = -1;
    showStatus('ролик долго не грузится, пропускаю', true);
    skipToNext();
    return;
  }

  if (video.paused) { video.play().catch(() => {}); return; }

  // играет, но время встало на месте — завис в середине (≈20 сек без движения)
  if (video.currentTime === lastTime) {
    if (++stuckTicks >= 4) {
      stuckTicks = 0; lastTime = -1;
      showStatus('ролик завис, переключаю', true);
      skipToNext();
      return;
    }
  } else stuckTicks = 0;
  lastTime = video.currentTime;
}, 5000);
</script>
</body>
</html>
